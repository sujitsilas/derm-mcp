    is in mouse. Use CD68, CD163, MSR1, MRC1 instead.
  ly6c: Ly6c1/Ly6c2 have no human ortholog. Classical monocytes are identified by CD14, FCN1, S100A12,
    VCAN, SELL.
  detc: Dendritic epidermal T cells (DETC) are a mouse-specific population.
